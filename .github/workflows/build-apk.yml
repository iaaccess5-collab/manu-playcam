name: Compiler Manu Play Cam (APK + Connect Mac + Connect Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ application Android
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Dépôt alimenté depuis le navigateur : si une archive source.zip est présente,
      # on la décompresse dans le dépôt et on enregistre les fichiers.
      - name: Importer source.zip (si présent)
        run: |
          if [ -f source.zip ]; then
            # l'archive remplace tout le code : les fichiers supprimés disparaissent aussi du dépôt
            git ls-files | grep -v -e '^source.zip$' -e '^\.github/' | xargs -r -d '\n' git rm -q
            unzip -o -q source.zip -d .
            git rm -q --cached source.zip || true
            rm -f source.zip
            git config user.name "manu-playcam-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -q -m "Import du code source Manu Play Cam" || echo "Rien à enregistrer"
            git push || echo "Push impossible (sans importance pour la compilation)"
          fi
          # mise à jour partielle : patch.zip (fichiers modifiés) + patch-delete.txt (fichiers supprimés)
          if [ -f patch.zip ]; then
            unzip -o -q patch.zip -d .
            if [ -f patch-delete.txt ]; then xargs -r -d '\n' git rm -q --ignore-unmatch < patch-delete.txt; rm -f patch-delete.txt; fi
            git rm -q --cached patch.zip || true
            rm -f patch.zip
            git config user.name "manu-playcam-bot"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -q -m "Mise à jour du code source Manu Play Cam" || echo "Rien à enregistrer"
            git push || echo "Push impossible (sans importance pour la compilation)"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tests (accords, MIDI, Wi-Fi, son de l'ordinateur)
        run: |
          pip install numpy==2.1.3
          mkdir -p /tmp/jt
          javac -encoding UTF-8 -d /tmp/jt app/src/main/java/com/manumusicprod/playcam/core/*.java app/src/test/java/com/manumusicprod/playcam/core/*.java
          java -Dstdout.encoding=UTF-8 -cp /tmp/jt com.manumusicprod.playcam.core.CoreTest /tmp/jt/t.mid /tmp/jt/t.wav
          java -Dstdout.encoding=UTF-8 -cp /tmp/jt com.manumusicprod.playcam.core.AppleMidiTest
          # Wi-Fi, puis câble USB (le téléphone se connecte au port 5011), puis liaison par le nom sans adresse
          for MODE in wifi usb; do
            FLAG=""; [ $MODE = wifi ] && FLAG="--no-usb"
            (java -Dstdout.encoding=UTF-8 -cp /tmp/jt com.manumusicprod.playcam.core.ConnectTest /tmp/jt/c.wav $MODE > /tmp/jt/connect-$MODE.log 2>&1; echo $? > /tmp/jt/connect-$MODE.rc) &
            sleep 2
            python3 companion/mmp_connect.py --console --tone --phone 127.0.0.1 --seconds 7 $FLAG
            sleep 3
            cat /tmp/jt/connect-$MODE.log
            test "$(cat /tmp/jt/connect-$MODE.rc)" = "0"
          done
          (java -Dstdout.encoding=UTF-8 -cp /tmp/jt com.manumusicprod.playcam.core.PairTest > /tmp/jt/pair.log 2>&1; echo $? > /tmp/jt/pair.rc) &
          sleep 1
          python3 companion/mmp_connect.py --console --tone --no-usb --seconds 12
          sleep 2
          cat /tmp/jt/pair.log
          test "$(cat /tmp/jt/pair.rc)" = "0"

      - name: Compiler l'APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Vérifier l'APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" | head -3
          mkdir -p out && cp "$APK" "out/ManuPlayCam-Android-v1.2.0.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  # ------------------------------------------------------------------ Connect pour Windows (installateur .exe)
  connect-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Importer source.zip (si présent)
        shell: bash
        run: |
          if [ -f source.zip ]; then unzip -o -q source.zip -d .; fi
          if [ -f patch.zip ]; then unzip -o -q patch.zip -d .; if [ -f patch-delete.txt ]; then xargs rm -f < patch-delete.txt; fi; fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dépendances
        working-directory: companion
        run: pip install -r requirements-win.txt
      - name: adb pour le câble USB
        working-directory: companion
        shell: bash
        run: |
          curl -sSL -o pt.zip https://dl.google.com/android/repository/platform-tools-latest-windows.zip
          unzip -q pt.zip
          mkdir -p adb && cp platform-tools/adb.exe platform-tools/AdbWinApi.dll platform-tools/AdbWinUsbApi.dll adb/
          cp platform-tools/NOTICE.txt adb/ 2>/dev/null || true
          ./adb/adb.exe version
      - name: Autotest
        working-directory: companion
        run: python mmp_connect.py --selftest
      - name: Construire l'application
        working-directory: companion
        run: pyinstaller --noconfirm ManuPlayCamConnect.spec
      - name: Capture de la fenêtre (contrôle du design)
        working-directory: companion
        continue-on-error: true
        run: python mmp_connect.py --screenshot connect-windows.png
      - name: Essai de l'application construite
        working-directory: companion
        continue-on-error: true
        shell: bash
        run: |
          ( "dist/Manu Play Cam Connect/Manu Play Cam Connect.exe" --smoketest 8 & sleep 30; kill $! 2>/dev/null ) || true
          cat "$LOCALAPPDATA/Manu Play Cam Connect.log" > smoke-windows.txt 2>&1 || echo "pas de journal" > smoke-windows.txt
          cat smoke-windows.txt
          grep -q "ESSAI FENÊTRE OK" smoke-windows.txt
      - name: Installateur (Inno Setup)
        working-directory: companion
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) { choco install innosetup -y --no-progress | Out-Null }
          $path = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $path) { $path = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $path installer.iss
          Copy-Item "dist-installer\ManuPlayCam-Connect-Windows-Setup.exe" "..\ManuPlayCam-Connect-Windows-Setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: connect-windows
          path: |
            ManuPlayCam-Connect-Windows-Setup.exe
            companion/connect-windows.png
            companion/smoke-windows.txt

  # ------------------------------------------------------------------ Connect pour Mac (.dmg) : Apple Silicon et Intel
  connect-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: AppleSilicon
          - runner: macos-15-intel
            arch: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Importer source.zip (si présent)
        run: |
          if [ -f source.zip ]; then unzip -o -q source.zip -d .; fi
          if [ -f patch.zip ]; then unzip -o -q patch.zip -d .; if [ -f patch-delete.txt ]; then xargs rm -f < patch-delete.txt; fi; fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dépendances
        working-directory: companion
        run: |
          pip install -r requirements-mac.txt
          # numpy publie aussi des versions réservées à macOS 14 : on prend celle qui marche dès macOS 10.13 / 11
          if [ "$(uname -m)" = "arm64" ]; then PLAT=macosx_11_0_arm64; else PLAT=macosx_10_13_x86_64; fi
          pip download numpy==2.1.3 --only-binary=:all: --no-deps --platform $PLAT --python-version 3.12 -d /tmp/np
          pip install --force-reinstall --no-deps /tmp/np/numpy-*.whl
      - name: adb pour le câble USB
        working-directory: companion
        run: |
          curl -sSL -o pt.zip https://dl.google.com/android/repository/platform-tools-latest-darwin.zip
          unzip -q pt.zip
          mkdir -p adb && cp platform-tools/adb adb/ && chmod +x adb/adb
          cp platform-tools/NOTICE.txt adb/ 2>/dev/null || true
          file adb/adb; ./adb/adb version
      - name: Autotest
        working-directory: companion
        run: python mmp_connect.py --selftest
      - name: Construire l'application
        working-directory: companion
        run: pyinstaller --noconfirm ManuPlayCamConnect.spec
      - name: Vérifier que l'application s'ouvre dès macOS 10.15
        working-directory: companion
        run: |
          find "dist/Manu Play Cam Connect.app" -path '*adb/adb' -exec sh -c 'echo "adb : $(otool -l "$1" | awk "/minos/{print \$2; exit}")"' _ {} \;
          # Mac Intel : dès macOS 10.15 ; Mac Apple Silicon : tous (ils ont au moins macOS 11)
          MIN=10.15; [ "$(uname -m)" = "arm64" ] && MIN=11.0
          bad=$(find "dist/Manu Play Cam Connect.app" -type f \( -name '*.so' -o -name '*.dylib' -o -perm -u+x \) ! -path '*adb/*' | while read -r f; do
            v=$(otool -l "$f" 2>/dev/null | awk '/minos/{print $2; exit}')
            [ -n "$v" ] && [ "$(printf '%s\n%s\n' "$v" "$MIN" | sort -V | tail -1)" != "$MIN" ] && echo "$v  $f" || true
          done)
          echo "${bad:-Tous les fichiers fonctionnent dès macOS $MIN}"
          test -z "$bad"
      - name: Capture de la fenêtre (contrôle du design)
        working-directory: companion
        continue-on-error: true
        run: perl -e 'alarm 60; exec @ARGV' python mmp_connect.py --screenshot connect-mac-${{ matrix.arch }}.png
      - name: Essai de l'application construite (comme un double-clic)
        working-directory: companion
        continue-on-error: true
        run: |
          set +e
          sw_vers; uname -m
          rm -f "$HOME/Library/Logs/Manu Play Cam Connect.log"
          perl -e 'alarm 60; exec @ARGV' "dist/Manu Play Cam Connect.app/Contents/MacOS/Manu Play Cam Connect" --smoketest 8; echo "code de sortie : $?" | tee -a "$HOME/Library/Logs/Manu Play Cam Connect.log"
          { sw_vers; uname -m; cat "$HOME/Library/Logs/Manu Play Cam Connect.log"; } > smoke-mac-${{ matrix.arch }}.txt 2>&1 || true
          ls -t "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null | head -3 | while read f; do echo "== $f"; head -80 "$HOME/Library/Logs/DiagnosticReports/$f"; done >> smoke-mac-${{ matrix.arch }}.txt 2>&1 || true
          cat smoke-mac-${{ matrix.arch }}.txt
          grep -q "ESSAI FENÊTRE OK" smoke-mac-${{ matrix.arch }}.txt && grep -q "code de sortie : 0" smoke-mac-${{ matrix.arch }}.txt
      - name: Créer le .dmg
        working-directory: companion
        run: |
          mkdir -p dmgroot
          cp -R "dist/Manu Play Cam Connect.app" dmgroot/
          ln -s /Applications dmgroot/Applications
          codesign --force --deep -s - "dmgroot/Manu Play Cam Connect.app" || true
          hdiutil create -volname "Manu Play Cam Connect" -srcfolder dmgroot -ov -format UDZO "../ManuPlayCam-Connect-Mac-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: connect-mac-${{ matrix.arch }}
          path: |
            ManuPlayCam-Connect-Mac-*.dmg
            companion/connect-mac-*.png
            companion/smoke-mac-*.txt

  # ------------------------------------------------------------------ test dans un téléphone Android virtuel
  test-emulator:
    needs: [ android, connect-windows, connect-mac ]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Importer source.zip (si présent)
        run: |
          if [ -f source.zip ]; then unzip -o -q source.zip -d .; fi
          if [ -f patch.zip ]; then unzip -o -q patch.zip -d .; if [ -f patch-delete.txt ]; then xargs rm -f < patch-delete.txt; fi; fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.1.3 mido==1.3.3
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: apk
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: art
      - name: Lancer l'application dans l'émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash tests/emulator.sh
      - name: Publier les aperçus (branche previews)
        if: always()
        run: |
          mkdir -p previews
          find art -name 'connect-windows*.png' -exec cp {} previews/ \; || true
          find art -name 'connect-mac-*.png' -exec cp {} previews/ \; || true
          find art -name 'smoke-*.txt' -exec cp {} previews/ \; || true
          rm -rf previews/sessions/*/*.wav
          cd previews
          git init -q && git checkout -q -b previews
          git config user.name "manu-playcam-bot" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Aperçus build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" previews

  # ------------------------------------------------------------------ page de téléchargement
  release:
    needs: [ android, connect-windows, connect-mac ]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - run: find art -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0-build${{ github.run_number }}
          name: Manu Play Cam 1.2 — build ${{ github.run_number }}
          body: |
            **Manu Play Cam** — MANU MUSIC PROD

            • **Téléphone Android** : `ManuPlayCam-Android-v1.2.0.apk` — télécharge-le sur le téléphone et ouvre-le pour l'installer.
            • **Mac** : `ManuPlayCam-Connect-Mac-AppleSilicon.dmg` (Mac M1, M2, M3, M4…) ou `ManuPlayCam-Connect-Mac-Intel.dmg` (Mac Intel).
            • **Windows** : `ManuPlayCam-Connect-Windows-Setup.exe`.

            Wi-Fi : mets l'ordinateur et le téléphone sur le même Wi-Fi, ouvre Manu Play Cam Connect et choisis l'appareil par son nom.
            Câble : active le débogage USB sur le téléphone (une seule fois) et branche-le. Le MIDI et le son de ton logiciel arrivent dans l'application.
          files: |
            art/android/*.apk
            art/connect-windows/*.exe
            art/connect-mac-*/*.dmg
          make_latest: true
